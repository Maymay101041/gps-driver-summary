<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Driver Summary</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Tahoma,sans-serif;background:#f4f7fb;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}table{border-collapse:collapse;width:100%;margin-top:15px}th,td{border:1px solid #ddd;padding:8px}th{background:#198754;color:#fff}h1{color:#198754}</style></head><body><div class="card"><h1>สรุปเวลาเริ่ม-สิ้นสุดการใช้รถจาก GPS</h1><input type="file" id="file" accept=".xlsx,.xls"><div id="out"></div></div><script>
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];const r=new FileReader();r.onload=x=>{const wb=XLSX.read(x.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});const summary={};for(let i=0;i<rows.length;i++){const row=rows[i];const start=row[2];const end=row[3];const status=row[5];if(!start||!end) continue;if(typeof start==='string'&&start.includes('/')){const d=start.split(' ')[0];if(!summary[d]) summary[d]={start:start,end:end};if(start<summary[d].start) summary[d].start=start;if(end>summary[d].end) summary[d].end=end;}}let html='<table><tr><th>วันที่</th><th>เริ่มใช้งาน</th><th>สิ้นสุดใช้งาน</th></tr>';Object.keys(summary).sort((a,b)=>{const pa=a.split('/').reverse().join('');const pb=b.split('/').reverse().join('');return pa.localeCompare(pb)}).forEach(d=>{html+=`<tr><td>${d}</td><td>${summary[d].start}</td><td>${summary[d].end}</td></tr>`});html+='</table>';document.getElementById('out').innerHTML=html;};r.readAsArrayBuffer(f);});
</script></body></html>
