<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Vehicle Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:#f5f6fa;
    font-family:Segoe UI,Tahoma,sans-serif;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h1{
    color:#107c41;
    margin-bottom:20px;
}

.cards{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin:25px 0;
}

.card{
    flex:1;
    min-width:250px;
    background:#14833b;
    color:white;
    padding:20px;
    border-radius:15px;
}

.card h3{
    margin:0;
    font-size:22px;
}

.card p{
    margin:15px 0 0;
    font-size:50px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#14833b;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f8f8;
}

.status{
    margin-top:15px;
    color:#444;
    font-size:18px;
}
</style>

</head>
<body>

<div class="container">

<h1>🚐 GPS Vehicle Dashboard</h1>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<div class="status" id="status">
เลือกไฟล์ Excel
</div>

<div class="cards">

<div class="card">
<h3>จำนวนวันใช้งาน</h3>
<p id="days">0</p>
</div>

<div class="card">
<h3>จำนวนเที่ยววิ่ง</h3>
<p id="trips">0</p>
</div>

<div class="card">
<h3>ระยะทางรวม (กม.)</h3>
<p id="distance">0</p>
</div>

</div>

<table>

<thead>
<tr>
<th>วันที่</th>
<th>เริ่มใช้งาน</th>
<th>สิ้นสุดใช้งาน</th>
<th>เที่ยววิ่ง</th>
<th>ระยะทางรวม (กม.)</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

<script>

document
.getElementById("excelFile")
.addEventListener("change",loadExcel);

function loadExcel(e){

const file=e.target.files[0];

if(!file) return;

document.getElementById("status").innerHTML=
"กำลังอ่านไฟล์ : "+file.name;

const reader=new FileReader();

reader.onload=function(evt){

try{

const data=new Uint8Array(evt.target.result);

const workbook=XLSX.read(data,{type:"array"});

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

const rows=
XLSX.utils.sheet_to_json(sheet,{
raw:true
});

processData(rows);

}catch(error){

console.error(error);

document.getElementById("status").innerHTML=
"❌ Error : "+error.message;

}

};

reader.readAsArrayBuffer(file);

}

function excelDate(serial){

if(typeof serial!=="number") return serial;

const utcDays =
Math.floor(serial-25569);

const utcValue =
utcDays*86400;

const date=
new Date(utcValue*1000);

const day=
String(date.getDate()).padStart(2,'0');

const month=
String(date.getMonth()+1).padStart(2,'0');

const year=
date.getFullYear();

return `${day}/${month}/${year}`;

}

function excelTime(serial){

if(typeof serial!=="number") return serial;

const totalSeconds=
Math.round(serial*86400);

const h=
Math.floor(totalSeconds/3600);

const m=
Math.floor((totalSeconds%3600)/60);

const s=
totalSeconds%60;

return (
String(h).padStart(2,'0')+":"
+
String(m).padStart(2,'0')+":"
+
String(s).padStart(2,'0')
);

}

function processData(rows){

const summary={};

let totalTrips=0;
let totalDistance=0;

rows.forEach(row=>{

const status =
String(
row["สถานะ"] ||
row["Status"] ||
""
).trim();

if(!status.includes("รถวิ่ง"))
return;

let date =
row["วันที่"];

let start =
row["เวลาเริ่มต้น"];

let end =
row["เวลาสิ้นสุด"];

date = excelDate(date);
start = excelTime(start);
end = excelTime(end);

const distance =
parseFloat(
row["ระยะทางรวม"] ||
row["ระยะทางรวม (กม.)"] ||
0
);

if(!summary[date]){

summary[date]={
start:start,
end:end,
distance:0,
trips:0
};

}

summary[date].trips++;
summary[date].distance+=distance;

if(start < summary[date].start)
summary[date].start=start;

if(end > summary[date].end)
summary[date].end=end;

totalTrips++;
totalDistance+=distance;

});

document.getElementById("days").innerHTML=
Object.keys(summary).length;

document.getElementById("trips").innerHTML=
totalTrips;

document.getElementById("distance").innerHTML=
totalDistance.toFixed(2);

const tbody=
document.getElementById("tableBody");

tbody.innerHTML="";

Object.keys(summary)

.sort((a,b)=>{

const aa=a.split('/').reverse().join('');
const bb=b.split('/').reverse().join('');

return aa.localeCompare(bb);

})

.forEach(date=>{

const d=summary[date];

tbody.innerHTML += `
<tr>
<td>${date}</td>
<td>${d.start}</td>
<td>${d.end}</td>
<td>${d.trips}</td>
<td>${d.distance.toFixed(2)}</td>
</tr>
`;

});

document.getElementById("status").innerHTML=
"✅ อ่านข้อมูลสำเร็จ "+rows.length+" รายการ";

}

</script>

</body>
</html>
