<script>

document.getElementById("excelFile").addEventListener("change", function(e){

const file = e.target.files[0];

const reader = new FileReader();

reader.onload = function(event){

const data = new Uint8Array(event.target.result);

const workbook = XLSX.read(data,{type:"array"});

const sheet = workbook.Sheets[workbook.SheetNames[0]];

const rows = XLSX.utils.sheet_to_json(sheet);

calculate(rows);

};

reader.readAsArrayBuffer(file);

});

function calculate(rows){

const daily={};

let totalDistance=0;
let totalTrips=0;

rows.forEach(r=>{

const status=(r["สถานะ"]||"").toString();

if(!status.includes("รถวิ่ง")) return;

const date=r["วันที่"];

const start=r["เวลาเริ่มต้น"];
const end=r["เวลาสิ้นสุด"];

const distance=parseFloat(r["ระยะทางรวม"] || r["ระยะทางรวม (กม.)"] || 0);

if(!daily[date]){

daily[date]={
start:start,
end:end,
distance:0,
trips:0
};

}

daily[date].trips++;
daily[date].distance+=distance;

totalTrips++;

totalDistance+=distance;

if(start < daily[date].start)
daily[date].start=start;

if(end > daily[date].end)
daily[date].end=end;

});

document.getElementById("days").innerText=
Object.keys(daily).length;

document.getElementById("trips").innerText=
totalTrips;

document.getElementById("distance").innerText=
totalDistance.toFixed(2);

const tbody=
document.querySelector("#resultTable tbody");

tbody.innerHTML="";

Object.keys(daily).sort().forEach(date=>{

const d=daily[date];

tbody.innerHTML+=`
<tr>
<td>${date}</td>
<td>${d.start}</td>
<td>${d.end}</td>
<td>${d.trips}</td>
<td>${d.distance.toFixed(2)}</td>
</tr>
`;

});

}

</script>
